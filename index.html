<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Validação</title>
    <link rel="stylesheet" href="./main.css" />
</head>

<body>
    <div class="center">
        <h1>Formulário de Validação</h1>
        <form id="valid-form">            
            <label for="campoA"> Campo A </label>
            <input type="number" id="campoA" required placeholder="Valor A" />
            <label for="campoB">Campo B</label>
            <input type="number" id="campoB" required placeholder="Valor B" />
            <p class="error-message">O valor B precisa ser maior que o valor A! </p>
            <p class="success-message">Formulário enviado com sucesso! </p>
            <button type="submit">Validar</button>
        </form>
    </div>
    <script src="main.js"></script>
</body>

</html>
